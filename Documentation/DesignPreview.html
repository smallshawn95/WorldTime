<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光影時鐘 — SwiftUI 介面設計預覽</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#f5f7fa;background:#080e17;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}button{font:inherit;cursor:pointer}header{max-width:1270px;margin:0 auto;padding:60px 24px 35px;display:flex;justify-content:space-between;gap:25px;align-items:end}.eyebrow{font-size:11px;letter-spacing:4px;color:#dfbd92;margin-bottom:18px}h1{font-weight:500;font-size:34px;letter-spacing:3px;margin:0 0 12px}header p{font-size:12px;color:#9baabb;line-height:1.8;margin:0}.mode{border:1px solid #465366;background:#192333;color:#e8caa3;border-radius:30px;padding:13px 20px;white-space:nowrap}.grid{max-width:1270px;margin:auto;padding:0 24px 50px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}.phone{background:#0b111b;border:1px solid #2c3747;border-radius:40px;overflow:hidden;box-shadow:0 20px 60px #0005}.status{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:12px;font-weight:600}.island{width:95px;height:23px;border-radius:20px;background:#03070c}.app{padding:8px 20px 18px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand h2{font-size:21px;font-family:Georgia,"Microsoft JhengHei",serif;font-weight:600;letter-spacing:1px;margin:0 0 6px}.brand h2 span{color:#e5bc8b;margin-right:6px}.brand p{margin:0;color:#aab6c6;font-size:11px}.edit{width:42px;height:42px;border-radius:50%;border:0;color:#dfe4ec;background:#ffffff0f;font-size:23px}.hero{height:510px;position:relative;border-radius:29px;overflow:hidden;isolation:isolate;border:1px solid #ffffff18}.cityart{width:100%;height:100%;object-fit:cover;object-position:bottom;position:absolute;inset:0;z-index:-1;pointer-events:none}.veil{position:absolute;inset:0;background:linear-gradient(transparent 55%,#0c172733 70%,#0c1727e6);z-index:0}.orb{position:absolute;right:15%;width:42px;height:42px;border-radius:50%;background:#fff0c9dd;box-shadow:0 0 45px 18px #ffe2b544;z-index:-2}.night .orb{width:30px;height:30px;background:#f0e3bf;box-shadow:0 0 42px 15px #bcd0f222}.night .orb:after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:#253956;left:10px;top:-5px}.starfield{position:absolute;inset:0;z-index:-3;background-image:radial-gradient(1px 1px at 15% 18%,#fff9 98%,transparent),radial-gradient(1px 1px at 60% 10%,#fff9 98%,transparent),radial-gradient(1px 1px at 40% 38%,#fff9 98%,transparent),radial-gradient(1.5px 1.5px at 83% 22%,#fff9 98%,transparent),radial-gradient(1px 1px at 30% 28%,#fff9 98%,transparent);display:none}.night .starfield{display:block}.hero-top{padding:25px;position:relative}.cityline{display:flex;align-items:start;justify-content:space-between}.english{font-size:10px;letter-spacing:3px;color:#ffffffbf;margin:0 0 7px}.cityname{font-size:30px;font-weight:600;letter-spacing:2px;line-height:1.3}.live{font-size:10px;padding:7px 10px;background:#ffffff1f;border-radius:20px}.live:before{content:"";display:inline-block;width:5px;height:5px;background:#bce8c7;border-radius:50%;vertical-align:middle;margin-right:5px}.clockline{margin-top:20px;display:flex;gap:7px;align-items:baseline}.clock{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:73px;font-weight:200;letter-spacing:-3px;line-height:1.12;font-variant-numeric:tabular-nums}.seconds{font-size:17px;font-weight:300;color:#ffffffa6;font-variant-numeric:tabular-nums}.date{font-size:13px;color:#ffffffd9;margin-top:8px}.hero-foot{position:absolute;bottom:25px;left:25px;right:25px}.period-line{display:flex;align-items:center;justify-content:space-between;font-size:13px}.zone{font-family:monospace;font-size:10px;color:#ffffffbf}.caption{font-size:12px;margin:10px 0 0;color:#ffffffd9}.periods{display:flex;gap:6px;padding:18px 10px 0}.phase{flex:1;text-align:center;font-size:10px;color:#aab6c6;cursor:pointer;background:none;border:0;padding:0}.phase:before{content:"";display:block;height:3px;background:#ffffff1f;border-radius:5px;margin-bottom:9px}.phase.active{color:#fff}.phase.active:before{background:var(--accent)}.chips{display:flex;gap:8px;margin:22px 0 28px}.chip{background:#ffffff0a;border:1px solid #ffffff0b;border-radius:30px;color:#aab6c6;padding:11px 17px;font-size:12px}.chip.active{background:#ffffff1f;border-color:#ffffff26;color:white}.chip.active:before{content:"";width:5px;height:5px;border-radius:100%;background:#e5bc8b;display:inline-block;margin-right:6px;vertical-align:middle}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px}.sectionhead h3{font-size:19px;font-family:Georgia,"Microsoft JhengHei",serif;margin:0 0 5px;font-weight:500}.sectionhead p{color:#aab6c6;font-size:10px;margin:0}.plus{width:40px;height:40px;border-radius:50%;border:0;color:#e5bc8b;background:#ffffff0f;font-size:25px;font-weight:200}.row{display:flex;align-items:center;gap:12px;padding:15px;background:#151e2b;border-radius:20px;margin-bottom:10px;cursor:pointer}.thumb{width:48px;height:58px;border-radius:12px;overflow:hidden;position:relative;flex-shrink:0}.thumb img{width:100%;height:100%;object-fit:cover;object-position:bottom}.row-name{font-size:16px;margin-bottom:6px}.row-meta{color:#aab6c6;font-size:10px}.row-end{margin-left:auto;text-align:right}.row-time{font-size:27px;font-weight:300;font-variant-numeric:tabular-nums;margin-bottom:5px}.footer{font-size:9px;color:#8b9aaf;text-align:center;padding:23px 0 3px}.label{font-size:11px;letter-spacing:2px;text-align:center;margin:19px 0 2px;color:#8292a6}.note{max-width:1270px;margin:0 auto;padding:0 24px 45px;color:#77889e;font-size:11px;line-height:1.8}dialog{border:1px solid #465366;color:#eef3fa;background:#151e2b;border-radius:24px;max-width:360px;padding:30px;line-height:1.8}dialog button{border:0;border-radius:30px;background:#e5bc8b;padding:9px 20px;margin-top:10px}@media(max-width:1000px){.grid{grid-template-columns:1fr;max-width:430px;gap:35px}header{max-width:450px;align-items:start;flex-direction:column;padding-top:35px}.label{margin-top:14px}}
</style>
<header><div><div class="eyebrow">LIGHT & TIME / SWIFTUI</div><h1>光影中的城市時光</h1><p>同一個此刻，三座城市，三種光影。<br>介面設計預覽，非 iOS 模擬器或實機截圖。</p></div><button class="mode" onclick="toggleLive()" id="mode">切換即時時間 ↗</button></header>
<main class="grid" id="grid"></main>
<div class="note">預設展示：2026 年 11 月 3 日 17:36 UTC。點城市名稱可切換；點六個時段可查看配色。SwiftUI App 依真實當地時間自動切換。完整的新增、刪除與排序功能請在 iOS 專案中使用。</div>
<dialog id="info"><strong>在 iOS App 中體驗</strong><p>這是介面設計預覽。完整收藏管理與 186 座城市搜尋，已在隨附的 SwiftUI 專案實作。</p><button onclick="document.querySelector('#info').close()">知道了</button></dialog>
<script>
const cities=[{id:'london',name:'倫敦',en:'LONDON',zone:'Europe/London',art:'London'},{id:'taipei',name:'臺北',en:'TAIPEI',zone:'Asia/Taipei',art:'Taipei'},{id:'new-york',name:'紐約',en:'NEW YORK',zone:'America/New_York',art:'NewYork'}];
const periods=[{name:'清晨',icon:'☀',caption:'第一道光，喚醒城市。',sky:['#343551','#a47c99','#ecc5af'],accent:'#f2c4cd',tint:'brightness(.85) saturate(.8)',y:57},{name:'早上',icon:'☀',caption:'陽光正好，日常徐徐展開。',sky:['#244d64','#7eb7c4','#e9dbc0'],accent:'#e8d5a0',tint:'brightness(1.03)',y:41},{name:'中午',icon:'☀',caption:'日光盛滿，世界清晰明亮。',sky:['#23526d','#6db2d3','#cedee0'],accent:'#bfe5ef',tint:'brightness(1.08)',y:34},{name:'下午',icon:'☀',caption:'讓時光，在光影裡慢一點。',sky:['#465b68','#adbbb4','#ebd4a7'],accent:'#e8cd9a',tint:'sepia(.16)',y:46},{name:'傍晚',icon:'☀',caption:'日色漸柔，城市染上金光。',sky:['#3b3653','#ba7b83','#e8b27f'],accent:'#f5c49a',tint:'brightness(.85) sepia(.25)',y:60},{name:'晚上',icon:'☾',caption:'燈火亮起，收藏一夜靜謐。',sky:['#101c38','#283d5d','#60728b'],accent:'#bcd0f2',tint:'brightness(.58) saturate(.7)',y:37}];
let live=false;let selected=[0,1,2];let forced=[null,null,null];
const art=c=>`../WorldTime/Assets.xcassets/${c.art}.imageset/${c.art}.png`;
const now=()=>live?new Date():new Date('2026-11-03T17:36:42Z');
function parts(c,d){const a=new Intl.DateTimeFormat('en-GB',{timeZone:c.zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d);return Object.fromEntries(a.map(x=>[x.type,x.value]));}
function phase(c,d){const h=+parts(c,d).hour;return h>=5&&h<7?0:h<11&&h>=7?1:h>=11&&h<14?2:h>=14&&h<17?3:h>=17&&h<19?4:5;}
function offset(c,d){const x=new Intl.DateTimeFormat('en',{timeZone:c.zone,timeZoneName:'longOffset'}).formatToParts(d).find(x=>x.type==='timeZoneName').value;return x.replace('GMT','UTC').replace('UTC-','UTC−')+(x==='GMT'?'+00:00':'');}
function offsetMin(c,d){return (Date.parse(d.toLocaleString('sv-SE',{timeZone:c.zone}).replace(' ','T')+'Z')-Math.floor(d.getTime()/1000)*1000)/60000;}
function relative(c,ref,d){const delta=offsetMin(c,d)-offsetMin(ref,d),m=Math.abs(delta),h=Math.floor(m/60),r=m%60;return delta===0?'相同時間':`${delta>0?'快':'慢'} ${h?h+' 小時':''}${r?r+' 分鐘':''}`;}
function day(c,d){return new Intl.DateTimeFormat('en-CA',{timeZone:c.zone,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function dateText(c,d){return new Intl.DateTimeFormat('zh-TW',{timeZone:c.zone,month:'long',day:'numeric',weekday:'long'}).format(d);}
function render(){const d=now();document.querySelector('#grid').innerHTML=selected.map((idx,n)=>{const c=cities[idx],p=periods[forced[n]??phase(c,d)],s=parts(c,d);return `<section><div class="phone"><div class="status"><span>9:41</span><div class="island"></div><span>▮▮▮ &nbsp; ◒ ▰</span></div><div class="app"><div class="brand"><div><h2><span>◐</span>光影時鐘</h2><p>在光影裡，遇見此刻。</p></div><button class="edit" aria-label="編輯收藏" onclick="info.showModal()">☷</button></div><div class="hero ${p===periods[5]?'night':''}" style="background:linear-gradient(${p.sky.join(',')});--accent:${p.accent}"><div class="starfield"></div><div class="orb" style="top:${p.y}%"></div><img class="cityart" alt="${c.name}風景插畫" src="${art(c)}" style="filter:${p.tint}"><div class="veil"></div><div class="hero-top"><div class="cityline"><div><p class="english">${c.en}</p><div class="cityname">${c.name}</div></div><div class="live">此刻</div></div><div class="clockline"><span class="clock">${s.hour}:${s.minute}</span><span class="seconds">${s.second}</span></div><div class="date">${dateText(c,d)}</div></div><div class="hero-foot"><div class="period-line"><span style="color:${p.accent}">${p.icon} &nbsp; ${p.name}</span><span class="zone">${offset(c,d)}</span></div><p class="caption">${p.caption}</p></div></div><div class="periods" style="--accent:${p.accent}">${periods.map((t,i)=>`<button class="phase ${t===p?'active':''}" onclick="forced[${n}]=${i};render()">${t.name}</button>`).join('')}</div><div class="chips">${cities.map((t,i)=>`<button class="chip ${idx===i?'active':''}" onclick="selected[${n}]=${i};forced[${n}]=null;render()">${t.name}</button>`).join('')}</div><div class="sectionhead"><div><h3>世界的此刻</h3><p>與${c.name}一起，看見世界的時間</p></div><button class="plus" onclick="info.showModal()" aria-label="新增城市">+</button></div>${cities.filter(t=>t!==c).map(t=>{const a=parts(t,d),tp=periods[phase(t,d)];return `<div class="row" onclick="selected[${n}]=${cities.indexOf(t)};forced[${n}]=null;render()"><div class="thumb" style="background:linear-gradient(${tp.sky.join(',')})"><img src="${art(t)}" alt=""></div><div><div class="row-name">${t.name}</div><div class="row-meta">${tp.name} · ${relative(t,c,d)}</div></div><div class="row-end"><div class="row-time">${a.hour}:${a.minute}</div><div class="row-meta">${day(t,d)===day(c,d)?'同一天':day(t,d)>day(c,d)?'後一天':'前一天'}</div></div></div>`}).join('')}<div class="footer">◷ &nbsp;${offset(c,d)} · 自動同步 &nbsp; ⓘ</div></div></div><p class="label">${c.en} / ${p.name}</p></section>`}).join('');}
function toggleLive(){live=!live;forced=[null,null,null];document.querySelector('#mode').textContent=live?'返回光影展示 ↗':'切換即時時間 ↗';render();}
render();setInterval(()=>{if(live)render()},1000);
</script>
</html>
